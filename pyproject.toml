[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "omniscout-tg"
version = "0.2.0"
description = "OmniScout-TG: Media-Planning Decision Intelligence & Attribution Engine for Telegram"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Proprietary" }
authors = [
    { name = "OmniScout-TG Engineering Team" }
]
dependencies = [
    "pydantic>=2.6.0,<3.0.0",
    "pydantic-settings>=2.2.0,<3.0.0",
    "requests>=2.31.0,<3.0.0",
    "httpx>=0.27.0,<1.0.0",
    "tenacity>=8.2.0,<10.0.0",
    "python-dotenv>=1.0.0,<2.0.0",
    "openpyxl>=3.1.2,<4.0.0",
    "telethon>=1.36.0,<2.0.0",
    "beautifulsoup4>=4.12.0,<5.0.0",
    "rich>=13.0.0,<16.0.0",
    "arabic-reshaper>=3.0.0",
    "python-bidi>=0.6.0",
    # Interfaces (web GUI + MCP server)
    "fastapi>=0.110.0,<1.0.0",
    "uvicorn>=0.27.0,<1.0.0",
    "mcp>=1.2.0,<2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0,<10.0.0",
    "pytest-mock>=3.12.0,<4.0.0",
    "pytest-cov>=4.1.0,<6.0.0",
    "pytest-asyncio>=0.23.0",
    "responses>=0.25.0,<1.0.0",
    "respx>=0.21.0,<1.0.0",
    "ruff>=0.3.0,<1.0.0",
]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
python_files = ["test_*.py", "verify_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
pythonpath = ["."]
addopts = "-ra --strict-markers -q"
markers = [
    "live: marks tests as requiring external network and B_AI_API_KEY (deselect with '-m \"not live\"')",
    "offline: marks fast offline unit/mock tests (runnable without external network or API keys)",
    "asyncio: marks async tests",
    "slow: marks slow tests",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["src", "config"]
